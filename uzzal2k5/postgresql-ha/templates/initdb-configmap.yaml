apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgresql-ha.fullname" . }}-initdb
  labels:
    app: { { - if .Values.replication.enabled } }
      { { include "replication.name" . } }
      { { - else } }
      { include "primary.name" . } }
      { { - end } }
data:
  {{- range $key, $val := .Values.postgresql.initdbScripts }}
    {{ $key }}: |
  {{ $val | indent 4 }}
  {{- end }}